<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0f1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WithFamily">
<!-- ✅ FIX: manifest link (was missing, caused PWA install to fail) -->
<link rel="manifest" href="/withfamily/withfamily-manifest.json">
<link rel="icon" href="/withfamily/icon-192.png">
<title>WithFamily</title>
<!-- ✅ FIX: register service worker (was missing, caused PWA install to fail) -->
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./withfamily-sw.js').catch(()=>{}));</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* ── TOKENS ── */
:root {
  --bg:     #0a0f1e;
  --surf:   #111827;
  --surf2:  #1e2a3a;
  --surf3:  #263345;
  --border: rgba(255,255,255,.08);
  --text:   #eef2ff;
  --dim:    #8899bb;
  --mute:   #4a5a72;
  --green:  #34d399;
  --yellow: #fbbf24;
  --red:    #f87171;
  --blue:   #60a5fa;
  --purple: #a78bfa;
  --r:      18px;
  --rs:     11px;
  --shadow: 0 8px 32px rgba(0,0,0,.45);
}

/* ── RESET ── */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0 }
html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--text);
  font-family:"PingFang SC","Hiragino Sans GB",-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent }

/* ── SCREENS ── */
.screen { display:none; height:100dvh; flex-direction:column; overflow:hidden }
.screen.active { display:flex }
.scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 16px 40px }

/* ── HEADER ── */
.hdr { padding:14px 18px; background:var(--surf); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
  backdrop-filter:blur(10px) }
.hdr-title { font-size:17px; font-weight:700; letter-spacing:.2px }
.hdr-right { display:flex; align-items:center; gap:10px }

/* ── BUTTONS ── */
.btn { display:flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 20px; border:none; border-radius:var(--rs);
  font-size:15px; font-weight:600; cursor:pointer; letter-spacing:.2px;
  transition:transform .1s, filter .15s, box-shadow .15s }
.btn:active { transform:scale(.96); filter:brightness(.8) }
.btn:disabled { opacity:.35; pointer-events:none }
.bp  { background:var(--blue);   color:#fff;       box-shadow:0 4px 16px rgba(96,165,250,.3) }
.bg  { background:var(--green);  color:#0a0f1e;    box-shadow:0 4px 16px rgba(52,211,153,.3) }
.bs  { background:var(--surf2);  color:var(--text); border:1px solid var(--border) }
.br  { background:var(--red);    color:#fff;       box-shadow:0 4px 16px rgba(248,113,113,.3) }
.bgh { background:var(--surf3);  color:var(--dim);  border:1px solid var(--border) }
.w100 { width:100% }
.mt6  { margin-top:6px }
.mt10 { margin-top:10px }
.ibtn { background:transparent; border:none; color:var(--dim); font-size:20px; cursor:pointer; padding:4px 8px }

/* ── SECTION LABEL ── */
.slabel { font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase;
  color:var(--mute); margin:20px 0 10px }
.slabel:first-child { margin-top:0 }

/* ── CARD ── */
.card { background:var(--surf); border:1px solid var(--border); border-radius:var(--r);
  padding:14px; margin-bottom:10px; transition:border-color .2s }
.card.c-red    { border-color:rgba(248,113,113,.4); background:rgba(248,113,113,.06) }
.card.c-yellow { border-color:rgba(251,191,36,.3);  background:rgba(251,191,36,.05) }
.card.c-green  { border-color:rgba(52,211,153,.25); background:rgba(52,211,153,.04) }
.card.c-purple { border-color:rgba(167,139,250,.3); background:rgba(167,139,250,.05) }
.card.c-home   { border-color:rgba(96,165,250,.3);  background:rgba(96,165,250,.05) }

/* ── MEMBER ROW ── */
.mrow  { display:flex; align-items:center; gap:12px }
.mava  { position:relative; width:44px; height:44px; border-radius:50%;
  background:var(--surf2); display:flex; align-items:center; justify-content:center;
  font-size:24px; flex-shrink:0 }
.mbadge { position:absolute; bottom:1px; right:1px; width:12px; height:12px;
  border-radius:50%; border:2px solid var(--surf) }
.mbadge.online  { background:var(--green) }
.mbadge.home    { background:var(--blue) }
.mbadge.sleep   { background:var(--purple) }
.mbadge.warning { background:var(--yellow) }
.mbadge.alert   { background:var(--red); animation:pulse 1.5s infinite }
.mbadge.unknown { background:var(--mute) }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.minfo { flex:1; min-width:0 }
.mname { font-size:15px; font-weight:600 }
.mstat { font-size:13px; margin-top:2px; font-weight:500 }
.mstat.online  { color:var(--green) }
.mstat.home    { color:var(--blue) }
.mstat.sleep   { color:var(--purple) }
.mstat.warning { color:var(--yellow) }
.mstat.alert   { color:var(--red) }
.mstat.unknown { color:var(--mute) }
.mtime { font-size:11px; color:var(--mute); margin-top:3px }

/* ── NUDGE BUTTON ── */
.nudge { background:var(--surf3); border:1px solid var(--border); border-radius:8px;
  color:var(--dim); font-size:12px; padding:6px 10px; cursor:pointer;
  transition:opacity .15s; flex-shrink:0 }
.nudge:active { opacity:.6 }
.nudge:disabled { opacity:.3; pointer-events:none }

/* ── CHIPS ── */
.chips { display:flex; flex-wrap:wrap; gap:8px }
.chip  { display:flex; align-items:center; gap:6px; background:var(--surf);
  border:1px solid var(--border); border-radius:20px; padding:6px 12px }
.chip.c-red    { border-color:rgba(248,113,113,.4) }
.chip.c-yellow { border-color:rgba(251,191,36,.3) }
.dot { width:8px; height:8px; border-radius:50%; flex-shrink:0 }
.dot.online  { background:var(--green) }
.dot.home    { background:var(--blue) }
.dot.sleep   { background:var(--purple) }
.dot.warning { background:var(--yellow) }
.dot.alert   { background:var(--red); animation:pulse 1.5s infinite }
.dot.unknown { background:var(--mute) }
.chip-name { font-size:13px; font-weight:600 }

/* ── EVENTS ── */
.ev { display:flex; align-items:flex-start; gap:10px; padding:10px 0;
  border-bottom:1px solid var(--border) }
.ev:last-child { border-bottom:none }
.ev-icon { font-size:20px; flex-shrink:0; margin-top:1px }
.ev-body { flex:1; min-width:0 }
.ev-msg  { font-size:13px; line-height:1.4 }
.ev-time { font-size:11px; color:var(--mute); margin-top:3px }
.cbtn { background:var(--blue); color:#fff; border:none; border-radius:8px;
  font-size:12px; padding:6px 10px; cursor:pointer; flex-shrink:0 }
.ctag { font-size:11px; color:var(--green); flex-shrink:0; align-self:center }

/* ── NUDGE CARD ── */
.ncard { display:flex; align-items:center; gap:12px; background:var(--surf);
  border:1px solid rgba(251,191,36,.3); border-radius:var(--r); padding:14px; margin-bottom:8px }
.ncard-icon { font-size:28px; flex-shrink:0 }
.ncard-body { flex:1; min-width:0 }
.ncard-msg  { font-size:14px; line-height:1.4 }
.ncard-time { font-size:11px; color:var(--mute); margin-top:4px }

/* ── ELDER HEADER ── */
.elder-hdr { padding:16px 18px; background:var(--surf); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; flex-shrink:0 }
.elder-greeting { font-size:22px; font-weight:700; margin-bottom:6px }
.elder-sub { font-size:14px; color:var(--dim) }

/* ── BIG BUTTONS (elder) ── */
.bbtn { display:flex; align-items:center; gap:14px; width:100%; padding:18px 20px;
  border:none; border-radius:var(--r); cursor:pointer; margin-bottom:10px;
  transition:transform .1s, filter .15s; text-align:left }
.bbtn:active { transform:scale(.97); filter:brightness(.85) }
.bicon { font-size:28px; line-height:1 }
.btxt  {}
.blabel { font-size:17px; font-weight:700; color:#fff }
.bsub   { font-size:12px; margin-top:2px; opacity:.7; color:#fff }
.bb-safe  { background:linear-gradient(135deg,#059669,#34d399); box-shadow:0 4px 20px rgba(52,211,153,.3) }
.bb-home  { background:linear-gradient(135deg,#2563eb,#60a5fa); box-shadow:0 4px 20px rgba(96,165,250,.3) }
.bb-sleep { background:linear-gradient(135deg,#6d28d9,#a78bfa); box-shadow:0 4px 20px rgba(167,139,250,.3) }
.bb-eat   { background:linear-gradient(135deg,#b45309,#fbbf24); box-shadow:0 4px 20px rgba(251,191,36,.3) }
.bb-default { background:var(--surf2); box-shadow:none }

/* ── TABS ── */
.tabbar { display:flex; background:var(--surf); border-bottom:1px solid var(--border);
  flex-shrink:0 }
.tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:10px 4px; background:none; border:none; color:var(--mute);
  font-size:10px; cursor:pointer; transition:color .15s; border-top:2px solid transparent }
.tab.active { color:var(--blue); border-top-color:var(--blue) }
.ti { font-size:18px }
.tab-pane { display:none }
.tab-pane.active { display:block }

/* ── CONN ── */
.conn  { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--mute) }
.cdot  { width:7px; height:7px; border-radius:50% }
.cdot.rt   { background:var(--green) }
.cdot.poll { background:var(--yellow) }

/* ── SPINNER ── */
.cspinner { display:flex; justify-content:center; padding:30px }
.spinner  { width:28px; height:28px; border:3px solid var(--border);
  border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite }
@keyframes spin { to { transform:rotate(360deg) } }

/* ── ADMIN ── */
.acard { background:var(--surf); border:1px solid var(--border); border-radius:var(--r);
  padding:16px; margin-bottom:10px }
.acard h3 { font-size:14px; font-weight:600; margin-bottom:12px; color:var(--dim) }
.arow { display:flex; align-items:center; gap:10px; padding:8px 0;
  border-bottom:1px solid var(--border) }
.arow:last-child { border-bottom:none }
.arow-info { flex:1; min-width:0 }
.arow-name { font-size:14px; font-weight:600 }
.arow-meta { font-size:11px; color:var(--mute); margin-top:2px }
.delbtn { background:rgba(248,113,113,.15); border:none; color:var(--red);
  border-radius:6px; padding:6px 10px; cursor:pointer; font-size:14px }
.form-stack > div { margin-bottom:10px }
.form-stack label { display:block; font-size:12px; color:var(--dim); margin-bottom:4px }
.form-stack input, .form-stack select {
  width:100%; background:var(--surf2); border:1px solid var(--border);
  border-radius:8px; padding:10px 12px; color:var(--text); font-size:14px }
.form-row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px }
.thresh-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px }
.thresh-grid label { display:block; font-size:12px; color:var(--dim); margin-bottom:4px }
.thresh-grid input { width:100%; background:var(--surf2); border:1px solid var(--border);
  border-radius:8px; padding:10px; color:var(--text); font-size:14px }

/* ── LOGIN ── */
.login-wrap { display:flex; flex-direction:column; align-items:center;
  justify-content:center; height:100%; padding:32px 24px }
.login-logo  { font-size:56px; margin-bottom:12px }
.login-title { font-size:24px; font-weight:700; margin-bottom:6px }
.login-sub   { font-size:14px; color:var(--dim); margin-bottom:32px }
.login-pick-label { font-size:12px; color:var(--mute); align-self:flex-start; margin-bottom:4px }
#pick-member { width:100%; background:var(--surf2); border:1px solid var(--border);
  border-radius:var(--rs); padding:14px 16px; color:var(--text); font-size:15px; margin-bottom:4px }
.admin-link  { margin-top:20px }
.admin-link button { background:none; border:none; color:var(--mute); font-size:12px;
  cursor:pointer; text-decoration:underline }

/* ── TOAST ── */
#toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px);
  background:rgba(30,42,58,.95); border:1px solid var(--border); backdrop-filter:blur(12px);
  color:var(--text); padding:10px 20px; border-radius:20px; font-size:14px; font-weight:500;
  opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:9999;
  white-space:nowrap }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0) }

/* ── OVERLAY ── */
#overlay { display:none; position:fixed; inset:0; background:rgba(5,8,18,.92);
  backdrop-filter:blur(16px); z-index:9000; flex-direction:column;
  align-items:center; justify-content:center; padding:32px; text-align:center }
#overlay.show { display:flex }
.ov-icon { font-size:64px; margin-bottom:16px; animation:bounce .6s ease infinite alternate }
@keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-8px)} }
#ov-title { font-size:22px; font-weight:700; margin-bottom:8px }
#ov-body  { font-size:15px; color:var(--dim); margin-bottom:32px; line-height:1.5 }
#overlay button { background:var(--green); color:#0a0f1e; border:none; border-radius:var(--r);
  padding:16px 40px; font-size:17px; font-weight:700; cursor:pointer }

/* ── ADMIN MODAL ── */
#admin-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6);
  backdrop-filter:blur(8px); z-index:8000; align-items:center; justify-content:center }
#admin-modal.show { display:flex }
.modal-box { background:var(--surf); border:1px solid var(--border); border-radius:var(--r);
  padding:24px; width:calc(100% - 48px); max-width:360px }
.modal-box h3 { font-size:17px; font-weight:700; margin-bottom:16px }
.modal-box input { width:100%; background:var(--surf2); border:1px solid var(--border);
  border-radius:8px; padding:12px; color:var(--text); font-size:15px; margin-bottom:8px }
.modal-box .btn { margin-top:10px }

/* ── MY STATUS CARD ── */
.my-status-card { background:var(--surf); border:1px solid var(--border); border-radius:var(--r);
  padding:16px; margin-bottom:16px; display:flex; align-items:center; gap:14px }
.my-status-icon { font-size:32px }
.my-status-info {}
.my-status-label { font-size:15px; font-weight:600 }
.my-status-time  { font-size:12px; color:var(--mute); margin-top:3px }
</style>
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="screen-login" class="screen active">
  <div class="login-wrap">
    <div class="login-logo">🏠</div>
    <h2 class="login-title">WithFamily</h2>
    <p class="login-sub">家庭报平安，彼此都安心</p>

    <p class="login-pick-label">你是谁？</p>
    <select id="pick-member">
      <option value="">加载中…</option>
    </select>
    <button class="btn bp w100 mt10" onclick="App.pickLogin()">进入 →</button>

    <div class="admin-link">
      <button onclick="App.showAdminModal()">管理员入口</button>
    </div>
  </div>
</div>

<!-- ══════════ ELDER ══════════ -->
<div id="screen-elder" class="screen">
  <div class="elder-hdr">
    <h1>🏠 WithFamily</h1>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="conn"><div class="cdot" id="e-cdot"></div><span id="e-clabel"></span></div>
      <button class="ibtn" onclick="App.logout()">↩</button>
    </div>
  </div>
  <div class="scroll">
    <p class="elder-greeting" id="e-greeting">你好！</p>
    <p class="elder-sub" id="e-sub">今天记得报平安哦 💙</p>
    <div id="e-btns">
      <div class="cspinner"><div class="spinner"></div></div>
    </div>
    <div class="slabel" style="margin-top:24px">家人状态</div>
    <div class="chips" id="e-chips">
      <div class="chip" style="color:var(--mute)">加载中…</div>
    </div>
    <div id="e-nudges" style="margin-top:14px"></div>
  </div>
</div>

<!-- ══════════ YOUNG ══════════ -->
<div id="screen-young" class="screen">
  <div class="hdr">
    <div class="hdr-title">🏠 WithFamily</div>
    <div class="hdr-right">
      <div class="conn"><div class="cdot" id="y-cdot"></div><span id="y-clabel"></span></div>
      <button class="ibtn" onclick="App.logout()">↩</button>
    </div>
  </div>
  <div class="tabbar">
    <button class="tab active" id="ytab-home" onclick="App.ytab('home')">
      <span class="ti">🏠</span>家庭
    </button>
    <button class="tab" id="ytab-feed" onclick="App.ytab('feed')">
      <span class="ti">📋</span>动态
    </button>
    <button class="tab" id="ytab-me" onclick="App.ytab('me')">
      <span class="ti">👤</span>我
    </button>
  </div>
  <div class="scroll tab-pane active" id="ytab-home-pane">
    <div class="slabel">家人状态</div>
    <div id="y-members"><div class="cspinner"><div class="spinner"></div></div></div>
  </div>
  <div class="scroll tab-pane" id="ytab-feed-pane">
    <div class="slabel">最新动态</div>
    <div id="y-events"><div class="cspinner"><div class="spinner"></div></div></div>
  </div>
  <div class="scroll tab-pane" id="ytab-me-pane">
    <div class="slabel">我的状态</div>
    <div id="y-my-status"></div>
    <div class="slabel">快速打卡</div>
    <div id="y-me-btns"></div>
    <div class="slabel">账号</div>
    <button class="btn bg w100" onclick="App.setupPush()">🔔 开启推送通知</button>
    <button class="btn bgh w100 mt6" onclick="App.logout()">退出登录</button>
  </div>
</div>

<!-- ══════════ ADMIN ══════════ -->
<div id="screen-admin" class="screen">
  <div class="hdr">
    <div class="hdr-title">⚙️ 管理后台</div>
    <button class="ibtn" onclick="App.logout()">↩</button>
  </div>
  <div class="scroll">

    <div class="slabel">家庭成员</div>
    <div class="acard">
      <h3>当前成员</h3>
      <div id="a-members"><div class="cspinner"><div class="spinner"></div></div></div>
      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
        <h3>添加成员</h3>
        <div class="form-stack">
          <div>
            <label>显示名称（如：奶奶）</label>
            <input type="text" id="nm-name" placeholder="奶奶">
          </div>
          <div class="form-row2">
            <div>
              <label>登录 Key（英文，唯一）</label>
              <input type="text" id="nm-key" placeholder="grandma">
            </div>
            <div>
              <label>是否长辈</label>
              <select id="nm-elder">
                <option value="true">长辈端</option>
                <option value="false">年轻人端</option>
              </select>
            </div>
          </div>
          <button class="btn bp w100" onclick="App.addMember()">+ 添加成员</button>
        </div>
      </div>
    </div>

    <div class="slabel">提醒阈值</div>
    <div class="acard">
      <h3>状态判断</h3>
      <div class="thresh-grid">
        <div>
          <label>🟡 黄色警告（小时）</label>
          <input type="number" id="s-warn" value="12" min="1">
        </div>
        <div>
          <label>🚨 红色警报（小时）</label>
          <input type="number" id="s-alert" value="24" min="1">
        </div>
      </div>
      <button class="btn bp w100" onclick="App.saveThresh()">保存设置</button>
    </div>

    <div class="slabel">最近事件</div>
    <div class="acard">
      <h3>打卡记录</h3>
      <div id="a-events"></div>
    </div>
  </div>
</div>

<!-- ══════════ ADMIN LOGIN MODAL ══════════ -->
<div id="admin-modal">
  <div class="modal-box">
    <h3>🔑 管理员登录</h3>
    <input type="password" id="admin-pw-input" placeholder="输入管理员密码">
    <button class="btn bp w100 mt10" onclick="App.adminLogin()">登录</button>
    <button class="btn bgh w100 mt6" onclick="App.hideAdminModal()">取消</button>
  </div>
</div>

<!-- ══════════ ALERT OVERLAY ══════════ -->
<div id="overlay">
  <div class="ov-icon" id="ov-icon">🚨</div>
  <p id="ov-title">有消息！</p>
  <p id="ov-body"></p>
  <button onclick="App.confirmOverlay()">✅ 我收到了</button>
</div>

<div id="toast"></div>

<script>
/* ════════════════════════════════════════
   CONFIG

// Returns display status: 'online'|'home'|'sleep'|'warning'|'alert'|'unknown'
function computeMemberStatus(m) {
  if (!m.last_checkin_at) return 'unknown';
  const h = (Date.now() - new Date(m.last_checkin_at).getTime()) / 3600000;
  const type = m.last_checkin_type || 'peace';

  // Within exemption window: show the specific state
  if (type === 'sleep' && h < SLEEP_EXEMPT_HOURS) return 'sleep';
  if (type === 'home'  && h < HOME_EXEMPT_HOURS)  return 'home';

  // Normal time-based status
  if (h < warnH)  return 'online';
  if (h < alertH) return 'warning';
  return 'alert';
}

// 将 base64url 转成 Uint8Array（applicationServerKey 需要）
_b64uToUint8(b64u) {
  const pad = '==='.slice((b64u.length + 3) % 4);
  const s = (b64u + pad).replace(/-/g, '+').replace(/_/g, '/');
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
},

async setupPush() {
  alert('setupPush called');
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
  alert('不支持：sw=' + ('serviceWorker' in navigator) + ' push=' + ('PushManager' in window));
  return;
}
alert('SW和Push都支持，继续执行');
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') {
        console.log('[Push] 用户拒绝通知权限');
        return;
      }
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: App._b64uToUint8(VAPID_PUBLIC_KEY),
      });
      console.log('[Push] 新订阅成功');
    } else {
      console.log('[Push] 已有订阅，同步中');
    }
    const subJson = sub.toJSON();
    const { error } = await db.from('wf_push_subscriptions').upsert({
      user_key:   me.user_key,
      endpoint:   subJson.endpoint,
      p256dh:     subJson.keys?.p256dh ?? '',
      auth:       subJson.keys?.auth   ?? '',
      updated_at: new Date().toISOString(),
    }, { onConflict: 'endpoint' });
    if (error) console.error('[Push] 存订阅失败:', error);
    else console.log('[Push] 订阅已同步');
  } catch(e) {
    console.error('[Push] setupPush 错误:', e);
  }
},

// 调用 Edge Function 向指定用户的所有设备推送通知
async sendPushTo(toKey, title, body, tag) {
  tag = tag || 'wf-nudge';
  try {
    const res = await fetch(PUSH_FUNCTION_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPA_KEY,
      },
      body: JSON.stringify({ to_key: toKey, title, body, tag }),
    });
    const result = await res.json();
    console.log('[Push] 推送结果:', result);
    return result;
  } catch(e) {
    console.error('[Push] 推送失败:', e);
    return null;
  }
},

async checkin(typeId, label) {
  if (!me) return;
  const now = new Date().toISOString();
  const msg = me.name + ' · ' + label;
  const { error: ue } = await db.from('wf_members')
    .update({ last_checkin_at: now, last_checkin_type: typeId })
    .eq('user_key', me.user_key);
  if (ue) { console.error('checkin update:', ue); App.toast('打卡失败：' + ue.message); return; }
  await db.from('wf_events').insert({
    type: 'checkin',
    from_key: me.user_key,
    to_key: null,
    message_type: typeId,
    message_text: msg,
    confirmed_by: [me.user_key]
  });
  App.toast('✅ 已打卡！');
  vibrate([50]);
  await App.loadData();
},

// ✅ FIX: nudge only inserts event with to_key, overlay only fires for that person
async nudge(toKey, toName) {
  if (!me) return;
  // ✅ FIX: prevent duplicate nudge if one is already pending
  const alreadyPending = events.some(e =>
    e.type === 'nudge' &&
    e.to_key === toKey &&
    !(e.confirmed_by || []).includes(toKey)
  );
  if (alreadyPending) { App.toast('已有未回复的催促，请等 ' + toName + ' 回应'); return; }

  const msg = me.name + ' 想知道你是否平安，快打个卡报平安吧 👋';
  await db.from('wf_events').insert({
    type: 'nudge',
    from_key: me.user_key,
    to_key: toKey,
    message_type: 'nudge',
    message_text: msg,
    confirmed_by: []
  });
  App.toast('👋 已催促 ' + toName);
  // ✅ 同时通过 Edge Function 发送系统级 Push 通知
  App.sendPushTo(
    toKey,
    '👋 ' + me.name + ' 催你啦！',
    msg,
    'wf-nudge-' + toKey
  );
  await App.loadData();
},

async confirmEv(id) {
  if (!me) return;
  const ev = events.find(e => e.id === id);
  if (!ev) return;
  const already = ev.confirmed_by || [];
  if (already.includes(me.user_key)) return;
  const { error } = await db.from('wf_events')
    .update({ confirmed_by: [...already, me.user_key] })
    .eq('id', id);
  if (error) { console.error('confirmEv:', error); return; }
  App.toast('✅ 已确认');
  await App.loadData();
},

async addMember() {
  const name    = document.getElementById('nm-name').value.trim();
  const userKey = document.getElementById('nm-key').value.trim().toLowerCase().replace(/\s+/g,'_');
  const isElder = document.getElementById('nm-elder').value === 'true';
  if (!name)    return App.toast('请输入显示名称');
  if (!userKey) return App.toast('请输入登录 Key');
  const { error } = await db.from('wf_members').insert({
    name, user_key: userKey, is_elder: isElder, sort_order: members.length
  });
  if (error) return App.toast('添加失败：' + (error.message || error.code || ''));
  document.getElementById('nm-name').value = '';
  document.getElementById('nm-key').value  = '';
  App.toast('✅ 已添加 ' + name);
  await App.loadData();
  App.loadPicker();
},

async delMember(id, name) {
  if (!confirm('确定删除 ' + name + '？')) return;
  const { error } = await db.from('wf_members').delete().eq('id', id);
  if (error) return App.toast('删除失败：' + error.message);
  App.toast('已删除 ' + name);
  await App.loadData();
  App.loadPicker();
},

async saveThresh() {
  const wh = parseInt(document.getElementById('s-warn').value)  || 12;
  const ah = parseInt(document.getElementById('s-alert').value) || 24;
  const { error } = await db.from('wf_settings')
    .upsert({ key:'thresholds', value:{ yellow_hours:wh, red_hours:ah }, updated_at:new Date().toISOString() },
            { onConflict:'key' });
  if (error) return App.toast('保存失败：' + error.message);
  warnH = wh; alertH = ah;
  App.toast('设置已保存 ✅');
  App.computeStatus(); App.renderAll();
},

/* ════════════════════════════════════════
   OVERLAY — ✅ FIX: only fires for to_key target
════════════════════════════════════════ */
checkOverlay() {
  if (!me || me.isAdmin) return;
  // Nudge targeting me specifically
  const nudge = events.find(e =>
    e.type === 'nudge' &&
    e.to_key === me.user_key &&      // ✅ strictly matches my user_key
    !(e.confirmed_by || []).includes(me.user_key)
  );
  if (nudge && ovId !== nudge.id) {
    ovId = nudge.id;
    App.showOverlay('👋', '家人催你啦！', nudge.message_text || '快打个卡吧', nudge.id);
    return;
  }
  // Alert: only show if no nudge overlay active
  if (!ovId) {
    const alertM = members.find(m => m._st === 'alert' && m.user_key !== me.user_key);
    if (alertM) {
      const fake = 'st_' + alertM.user_key;
      if (ovId !== fake) {
        ovId = fake;
        App.showOverlay('🚨', alertM.name + ' 长时间没打卡！', '请联系确认是否安全', null);
      }
    }
  }
},

showOverlay(icon, title, body, evId) {
  document.getElementById('ov-icon').textContent = icon;
  document.getElementById('ov-title').textContent = title;
  document.getElementById('ov-body').textContent  = body;
  document.getElementById('overlay').dataset.evid  = evId || '';
  document.getElementById('overlay').classList.add('show');
  vibrate([200,80,200,80,300]);
  speak(title + '。' + body);
},

async confirmOverlay() {
  const evId = document.getElementById('overlay').dataset.evid;
  document.getElementById('overlay').classList.remove('show');
  ovId = null;
  if (evId && !evId.startsWith('st_')) await App.confirmEv(evId);
},

/* ════════════════════════════════════════
   REALTIME + POLL
════════════════════════════════════════ */
startRT() {
  App.stopRT();
  try {
    rtSub = db.channel('wf-realtime-v3')
      .on('postgres_changes',{ event:'*',schema:'public',table:'wf_members' }, () => App.loadData())
      .on('postgres_changes',{ event:'*',schema:'public',table:'wf_events'  }, () => App.loadData())
      .subscribe(status => {
        rtOk = status === 'SUBSCRIBED';
        App.updateConn();
      });
  } catch(e) { rtOk=false; App.updateConn(); }
},
stopRT() {
  if (rtSub) { db.removeChannel(rtSub); rtSub=null; }
  rtOk=false;
},
startPoll() {
  App.stopPoll();
  pollT = setInterval(async () => {
    if (!rtOk) await App.loadData();
    else { App.computeStatus(); App.renderAll(); }
  }, 30000);
},
stopPoll() { if (pollT) { clearInterval(pollT); pollT=null; } },
updateConn() {
  [['e','elder'],['y','young']].forEach(([pfx]) => {
    const d = document.getElementById(pfx+'-cdot');
    const l = document.getElementById(pfx+'-clabel');
    if (!d||!l) return;
    d.className = 'cdot ' + (rtOk ? 'rt' : 'poll');
    l.textContent = rtOk ? '实时' : '轮询';
  });
},

/* ════════════════════════════════════════
   UI HELPERS
════════════════════════════════════════ */
show(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('screen-' + name);
  if (el) el.classList.add('active');
},

ytab(tab) {
  ['home','feed','me'].forEach(t => {
    document.getElementById('ytab-'+t+'-pane').classList.toggle('active', t===tab);
    document.getElementById('ytab-'+t).classList.toggle('active', t===tab);
  });
},

toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2800);
},

}; // end App

/* ── helpers ── */
function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function timeAgo(iso) {
  if (!iso) return '未知';
  const m = Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if (m < 1)  return '刚刚';
  if (m < 60) return m + '分钟前';
  const h = Math.floor(m/60);
  if (h < 24) return h + '小时前';
  return Math.floor(h/24) + '天前';
}
function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p) } catch(_){} }
function speak(text) {
  try {
    if (!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.9;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch(_){}
}

/* ── BOOT ── */
document.addEventListener('DOMContentLoaded', () => {
  App.init();
  document.getElementById('admin-pw-input')
    .addEventListener('keydown', e => { if (e.key==='Enter') App.adminLogin(); });
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && me) App.loadData();
});
</script>
