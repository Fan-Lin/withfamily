<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#1a1230"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png"/>
<title>WithFamily</title>
<script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#12101e;--surface:#1e1b30;--surface2:#2a2645;--border:#3a3660;--gold:#e8c547;--text:#f0eeff;--text-dim:#8a88b0;--green:#52c97b;--yellow:#f5a623;--red:#e84855;--font:'DM Sans',sans-serif;--display:'Cormorant Garamond',serif;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.view{display:none;flex-direction:column;height:100dvh;overflow:hidden}
.view.active{display:flex}
/* LOADING */
#view-loading{align-items:center;justify-content:center;gap:16px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-title{font-family:var(--display);font-size:28px;color:var(--gold)}
/* HEADER */
.app-header{padding:calc(16px + var(--safe-top)) 20px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
.app-title{font-family:var(--display);font-size:22px;color:var(--text)}
.header-btn{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:none;color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
/* STATUS COLORS */
.s-green{background:var(--green)}
.s-yellow{background:var(--yellow)}
.s-red{background:var(--red);animation:pulse-red 1.5s ease-in-out infinite}
.s-new{background:var(--border)}
@keyframes pulse-red{0%,100%{opacity:1}50%{opacity:.6}}
/* WALL VIEW */
#view-wall .scroll-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.member-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .2s}
.member-card:active{border-color:var(--gold)}
.member-avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;transition:background .5s}
.member-info{flex:1;min-width:0}
.member-name{font-size:17px;font-weight:600;margin-bottom:3px}
.member-status-text{font-size:12px;color:var(--text-dim)}
.member-time{font-size:11px;color:var(--text-dim);margin-top:2px}
.member-badge{font-size:11px;padding:3px 10px;border-radius:12px;background:var(--surface2);color:var(--text-dim);flex-shrink:0}
.pending-dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex-shrink:0;animation:pulse-red 1s infinite}
/* ELDER VIEW */
#view-elder{align-items:center;justify-content:space-between;padding:calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom))}
.elder-status-circle{width:180px;height:180px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:background .5s;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.elder-status-name{font-size:28px;font-weight:600;color:#fff}
.elder-status-label{font-size:14px;color:rgba(255,255,255,.8)}
.elder-status-time{font-size:12px;color:rgba(255,255,255,.6)}
.elder-buttons{width:100%;display:flex;flex-direction:column;gap:12px}
.elder-btn{width:100%;padding:20px;border-radius:20px;background:var(--surface);border:2px solid var(--border);color:var(--text);font-family:var(--font);font-size:20px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:10px}
.elder-btn:active{transform:scale(.97);border-color:var(--gold);background:var(--surface2)}
.elder-family-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.family-dot-item{display:flex;flex-direction:column;align-items:center;gap:5px}
.family-dot{width:14px;height:14px;border-radius:50%;transition:background .5s}
.family-dot-name{font-size:10px;color:var(--text-dim)}
/* YOUNG VIEW */
#view-young{overflow-y:auto}
.young-scroll{padding:16px;padding-bottom:calc(16px + var(--safe-bottom))}
.my-status-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.my-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.my-info{flex:1}
.my-name{font-size:16px;font-weight:600}
.my-status-text{font-size:12px;color:var(--text-dim);margin-top:2px}
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:10px}
.action-row{display:flex;gap:10px;margin-bottom:20px}
.action-btn{flex:1;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .15s}
.action-btn:active{border-color:var(--gold)}
.action-btn-icon{font-size:22px}
.family-compact-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.family-compact-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}
.compact-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;transition:background .5s}
.compact-name{font-size:13px;font-weight:500;flex:1}
.compact-time{font-size:10px;color:var(--text-dim)}
.history-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.history-icon{font-size:18px;flex-shrink:0}
.history-text{flex:1;font-size:13px;line-height:1.5}
.history-time{font-size:10px;color:var(--text-dim);flex-shrink:0;margin-top:2px}
/* ADMIN VIEW */
#view-admin{overflow:hidden}
.admin-scroll{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.admin-section{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}
.admin-section-title{font-size:13px;font-weight:600;color:var(--gold);margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em}
.member-admin-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.member-admin-item:last-child{border-bottom:none}
.member-admin-name{flex:1;font-size:15px}
.member-admin-key{font-size:11px;color:var(--text-dim)}
.item-del{width:28px;height:28px;border-radius:50%;background:transparent;border:1px solid var(--border);color:var(--red);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.reminder-admin-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.reminder-admin-item:last-child{border-bottom:none}
.reminder-label-text{flex:1;font-size:14px}
.reminder-voice-text{font-size:11px;color:var(--text-dim)}
.link-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text-dim);word-break:break-all;margin-bottom:6px;cursor:pointer}
.link-box:active{border-color:var(--gold)}
/* SHEETS */
.sheet-overlay{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
.sheet-overlay.open{display:flex}
.sheet{width:100%;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--border);padding-bottom:calc(24px + var(--safe-bottom));max-height:85dvh;display:flex;flex-direction:column;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 8px;flex-shrink:0}
.sheet-title{font-family:var(--display);font-size:20px;font-weight:600;padding:8px 20px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.sheet-body{padding:16px 20px;overflow-y:auto}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-family:var(--font);font-size:15px;outline:none;-webkit-appearance:none}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.field select option{background:var(--surface)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.toggle-label{font-size:14px}
.toggle{width:44px;height:24px;background:var(--border);border-radius:12px;position:relative;cursor:pointer;transition:background .2s;border:none}
.toggle.on{background:var(--green)}
.toggle::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s}
.toggle.on::after{transform:translateX(20px)}
.btn-primary{width:100%;padding:14px;border-radius:12px;background:var(--gold);border:none;color:#1a1a0e;font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-primary:active{opacity:.85}
.btn-secondary{width:100%;padding:13px;border-radius:12px;background:transparent;border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:15px;cursor:pointer;margin-top:8px}
.btn-secondary:active{border-color:var(--gold)}
.btn-danger{width:100%;padding:13px;border-radius:12px;background:transparent;border:1px solid #5a2020;color:var(--red);font-family:var(--font);font-size:15px;cursor:pointer;margin-top:8px}
/* REMINDER OVERLAY */
#reminder-overlay{position:fixed;inset:0;z-index:900;background:rgba(18,16,30,.95);display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
#reminder-overlay.show{display:flex;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.reminder-icon-big{font-size:64px;margin-bottom:16px;animation:bounce .6s ease infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-12px)}}
.reminder-from{font-size:16px;color:var(--text-dim);margin-bottom:8px}
.reminder-message-big{font-family:var(--display);font-size:36px;font-weight:600;color:var(--text);margin-bottom:32px;line-height:1.3}
.btn-confirm-big{padding:20px 48px;border-radius:24px;background:var(--green);border:none;color:#fff;font-family:var(--font);font-size:22px;font-weight:600;cursor:pointer;box-shadow:0 8px 32px rgba(82,201,123,.35)}
.btn-confirm-big:active{transform:scale(.97)}
/* PENDING REMINDERS BADGE */
.pending-reminder-bar{background:var(--red);padding:12px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;flex-shrink:0}
.pending-reminder-bar.hidden{display:none}
.pending-text{flex:1;font-size:14px;font-weight:500}
.pending-arrow{font-size:18px}
/* MEMBER SELECTOR */
.member-selector-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.member-sel-btn{padding:14px;border-radius:12px;background:var(--bg);border:2px solid var(--border);color:var(--text);font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;text-align:center;transition:border-color .15s}
.member-sel-btn.selected{border-color:var(--gold);background:rgba(232,197,71,.1)}
.member-sel-btn.all-btn{grid-column:1/-1}
/* REMINDER TYPE SELECTOR */
.remind-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.remind-type-btn{padding:14px;border-radius:12px;background:var(--bg);border:2px solid var(--border);color:var(--text);font-family:var(--font);font-size:15px;font-weight:500;cursor:pointer;text-align:center}
.remind-type-btn.selected{border-color:var(--gold);background:rgba(232,197,71,.1)}
/* TOAST */
#toast{position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);z-index:999;background:var(--surface2);border:1px solid var(--border);border-radius:24px;padding:10px 20px;font-size:14px;white-space:nowrap;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* CONFIRMED ITEMS */
.confirmed-check{font-size:12px;color:var(--green);margin-left:6px}
/* PASSWORD PROMPT */
#pwd-overlay{position:fixed;inset:0;z-index:800;background:rgba(18,16,30,.98);display:none;align-items:center;justify-content:center;padding:24px}
#pwd-overlay.show{display:flex}
.pwd-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 24px;width:100%;max-width:340px;text-align:center}
.pwd-title{font-family:var(--display);font-size:24px;margin-bottom:20px}
.pwd-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-size:18px;letter-spacing:.2em;text-align:center;outline:none;margin-bottom:12px}
.pwd-input:focus{border-color:var(--gold)}
/* HISTORY SECTION */
.history-empty{color:var(--text-dim);font-size:13px;text-align:center;padding:20px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<!-- LOADING -->
<div id="view-loading" class="view active">
  <div class="spinner"></div>
  <div class="load-title">WithFamily</div>
</div>

<!-- WALL VIEW (no user param) -->
<div id="view-wall" class="view">
  <div class="app-header">
    <div class="app-title">WithFamily</div>
    <button class="header-btn" onclick="openAdminPrompt()" title="管理">⚙</button>
  </div>
  <div id="wall-pending-bar" class="pending-reminder-bar hidden" onclick="showPendingReminder()">
    <span class="pending-text" id="wall-pending-text">有新提醒</span>
    <span class="pending-arrow">→</span>
  </div>
  <div class="scroll-body"><div id="member-grid"></div></div>
</div>

<!-- ELDER VIEW -->
<div id="view-elder" class="view">
  <div id="elder-pending-bar" class="pending-reminder-bar hidden" onclick="showPendingReminder()">
    <span class="pending-text" id="elder-pending-text">有新提醒</span>
    <span class="pending-arrow">→</span>
  </div>
  <div id="elder-status-circle" class="elder-status-circle s-green" style="margin:0 auto">
    <div class="elder-status-name" id="elder-name">我</div>
    <div class="elder-status-label" id="elder-status-label">平安</div>
    <div class="elder-status-time" id="elder-status-time"></div>
  </div>
  <div class="elder-buttons" id="elder-buttons"></div>
  <div>
    <div style="font-size:12px;color:var(--text-dim);text-align:center;margin-bottom:10px">家人状态</div>
    <div class="elder-family-row" id="elder-family-row"></div>
  </div>
</div>

<!-- YOUNG VIEW -->
<div id="view-young" class="view">
  <div class="app-header">
    <div class="app-title" id="young-title">WithFamily</div>
    <button class="header-btn" onclick="openAdminPrompt()">⚙</button>
  </div>
  <div id="young-pending-bar" class="pending-reminder-bar hidden" onclick="showPendingReminder()">
    <span class="pending-text" id="young-pending-text">有新提醒</span>
    <span class="pending-arrow">→</span>
  </div>
  <div class="young-scroll" id="young-scroll">
    <div class="my-status-card">
      <div class="my-avatar s-green" id="young-avatar">👤</div>
      <div class="my-info">
        <div class="my-name" id="young-name">我</div>
        <div class="my-status-text" id="young-status-text">状态更新中…</div>
      </div>
    </div>
    <div class="action-row">
      <button class="action-btn" onclick="openCheckinSheet()"><span class="action-btn-icon">✅</span>打卡</button>
      <button class="action-btn" onclick="openRemindSheet()"><span class="action-btn-icon">📣</span>催一催</button>
    </div>
    <div class="section-label">家人状态</div>
    <div class="family-compact-grid" id="young-family-grid"></div>
    <div class="section-label">最近动态</div>
    <div id="young-history"></div>
  </div>
</div>

<!-- ADMIN VIEW -->
<div id="view-admin" class="view">
  <div class="app-header">
    <button class="header-btn" onclick="switchToMain()">←</button>
    <div class="app-title">管理后台</div>
    <div style="width:36px"></div>
  </div>
  <div class="admin-scroll">
    <!-- Members -->
    <div class="admin-section">
      <div class="admin-section-title">成员管理</div>
      <div id="admin-member-list"></div>
      <button class="btn-secondary" onclick="openAddMemberSheet()" style="margin-top:10px">+ 添加成员</button>
    </div>
    <!-- Links -->
    <div class="admin-section">
      <div class="admin-section-title">成员链接</div>
      <div id="admin-links"></div>
    </div>
    <!-- Reminders -->
    <div class="admin-section">
      <div class="admin-section-title">提醒类型</div>
      <div id="admin-reminder-list"></div>
      <button class="btn-secondary" onclick="openAddReminderSheet()" style="margin-top:10px">+ 添加提醒</button>
    </div>
    <!-- History -->
    <div class="admin-section">
      <div class="admin-section-title">最近30条记录</div>
      <div id="admin-history"></div>
    </div>
    <!-- Clean -->
    <div class="admin-section">
      <div class="admin-section-title">数据维护</div>
      <button class="btn-danger" onclick="cleanOldEvents()">清理30天前的记录</button>
    </div>
    <div style="text-align:center;font-size:11px;color:var(--text-dim);opacity:.4;margin:16px 0">WithFamily v1.0.0</div>
  </div>
</div>

<!-- REMINDER OVERLAY (incoming) -->
<div id="reminder-overlay">
  <div class="reminder-icon-big" id="ro-icon">📣</div>
  <div class="reminder-from" id="ro-from">有人提醒你</div>
  <div class="reminder-message-big" id="ro-message">记得吃饭</div>
  <button class="btn-confirm-big" onclick="confirmReminder()">我知道了 ✓</button>
</div>

<!-- PASSWORD OVERLAY -->
<div id="pwd-overlay">
  <div class="pwd-box">
    <div class="pwd-title">管理员登录</div>
    <input class="pwd-input" id="pwd-input" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')checkPassword()"/>
    <button class="btn-primary" onclick="checkPassword()">进入</button>
    <button class="btn-secondary" onclick="closePwdOverlay()">取消</button>
  </div>
</div>

<!-- SHEET: CHECK IN -->
<div class="sheet-overlay" id="sheet-checkin">
  <div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-title">打卡</div>
    <div class="sheet-body">
      <div class="remind-type-grid" id="checkin-type-grid"></div>
      <button class="btn-secondary" onclick="closeSheet('sheet-checkin')">取消</button>
    </div>
  </div>
</div>

<!-- SHEET: SEND REMINDER -->
<div class="sheet-overlay" id="sheet-remind">
  <div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-title">催一催</div>
    <div class="sheet-body">
      <div class="field"><label>发给谁</label><div class="member-selector-grid" id="remind-to-grid"></div></div>
      <div class="field"><label>提醒内容</label><div class="remind-type-grid" id="remind-type-grid"></div></div>
      <button class="btn-primary" onclick="sendReminder()">发送提醒</button>
      <button class="btn-secondary" onclick="closeSheet('sheet-remind')">取消</button>
    </div>
  </div>
</div>

<!-- SHEET: ADD MEMBER -->
<div class="sheet-overlay" id="sheet-add-member">
  <div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-title">添加成员</div>
    <div class="sheet-body">
      <div class="field"><label>称呼</label><input type="text" id="new-member-name" placeholder="如：奶奶、妈妈、小明…"/></div>
      <div class="field"><label>链接标识（英文或拼音）</label><input type="text" id="new-member-key" placeholder="如：nainai、mama、xiaoming…"/></div>
      <div class="toggle-row"><span class="toggle-label">长辈（简化界面）</span><button class="toggle" id="elder-toggle" onclick="this.classList.toggle('on')"></button></div>
      <button class="btn-primary" onclick="addMember()">添加</button>
      <button class="btn-secondary" onclick="closeSheet('sheet-add-member')">取消</button>
    </div>
  </div>
</div>

<!-- SHEET: ADD REMINDER TYPE -->
<div class="sheet-overlay" id="sheet-add-reminder">
  <div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-title">添加提醒类型</div>
    <div class="sheet-body">

      <div class="field"><label>语音播报（用{name}代表发送者名字）</label><input type="text" id="new-remind-voice" placeholder="如：{name}说记得喝水"/></div>

<div id="toast"></div>

<script>
const SUPABASE_URL='https://slzqgtgmzqcqtnhnqoms.supabase.co';
const SUPABASE_KEY='sb_publishable_u91QHSj9kppOiBPvvCoBfw_vvZgihUT';
const {createClient}=supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null,allMembers=[],reminderTypes=[],thresholds={yellow_hours:12,red_hours:24};
let pendingReminders=[],selectedRemindTo=[],selectedRemindType=null,selectedCheckinType=null;
let currentReminderEvent=null;

// ── INIT ──
async function init(){
  const url=new URLSearchParams(location.search);
  const userKey=url.get('user'),isAdmin=url.has('admin');
  await loadSettings();
  await loadMembers();
  requestNotificationPermission();
  subscribeRealtime();
  if(isAdmin){showPwdOverlay();return}
  if(userKey){
    const member=allMembers.find(m=>m.user_key===userKey);
    if(!member){showView('view-wall');toast('未找到成员：'+userKey);return}
    currentUser=member;
    if(member.is_elder)initElderView();else initYoungView();
  }else{
    showView('view-wall');renderWall();
  }
  loadAndCheckPendingReminders();
}

async function loadSettings(){
  const{data}=await db.from('wf_settings').select('*');
  if(!data)return;
  data.forEach(s=>{
    if(s.key==='reminder_types')reminderTypes=s.value;
    if(s.key==='thresholds')thresholds=s.value;
  });
}
async function loadMembers(){
  const{data}=await db.from('wf_members').select('*').order('sort_order').order('created_at');
  allMembers=data||[];
}

// ── STATUS ──
function getStatus(m){
  if(!m.last_checkin_at)return'new';
  const h=(Date.now()-new Date(m.last_checkin_at))/3600000;
  if(h<thresholds.yellow_hours)return'green';
  if(h<thresholds.red_hours)return'yellow';
  return'red';
}
function getStatusClass(s){return's-'+s}
function getStatusLabel(s){
  const map={green:'平安',yellow:'未打卡',red:'请注意',new:'尚未打卡'};return map[s]||'';
}
function fmtTime(ts){
  if(!ts)return'从未打卡';
  const d=new Date(ts),now=new Date(),diff=now-d;
  const h=Math.floor(diff/3600000),m=Math.floor(diff/60000);
  if(m<1)return'刚刚';if(h<1)return m+'分钟前';if(h<24)return h+'小时前';
  return Math.floor(h/24)+'天前';
}
function getCheckinIcon(type){
  const icons={peace:'🕊',home:'🏠',sleep:'🌙',eat:'🍚'};return icons[type]||'✅';
}

// ── WALL VIEW ──
function renderWall(){
  const el=document.getElementById('member-grid');
  if(!allMembers.length){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-dim)">还没有成员<br/>前往 ?admin 添加</div>';return}
  el.innerHTML=allMembers.map(m=>{
    const s=getStatus(m),icon=getCheckinIcon(m.last_checkin_type);
    const hasPending=pendingReminders.some(r=>!r.confirmed_by?.includes(m.user_key)&&(r.to_key===m.user_key||r.to_key===null));
    return`<div class="member-card" onclick="openMemberFromWall('${m.user_key}')">
      <div class="member-avatar ${getStatusClass(s)}">${icon}</div>
      <div class="member-info">
        <div class="member-name">${m.name}</div>
        <div class="member-status-text">${getStatusLabel(s)}</div>
        <div class="member-time">${fmtTime(m.last_checkin_at)}</div>
      </div>
      ${hasPending?'<div class="pending-dot"></div>':'<div class="member-badge">'+getStatusLabel(s)+'</div>'}
    </div>`;
  }).join('');
}
function openMemberFromWall(key){
  const m=allMembers.find(x=>x.user_key===key);if(!m)return;
  currentUser=m;if(m.is_elder)initElderView();else initYoungView();
}

// ── ELDER VIEW ──
function initElderView(){
  showView('view-elder');updateElderUI();renderElderFamily();buildElderButtons();
}
function updateElderUI(){
  if(!currentUser)return;
  const s=getStatus(currentUser);
  const circle=document.getElementById('elder-status-circle');
  circle.className='elder-status-circle '+getStatusClass(s);
  document.getElementById('elder-name').textContent=currentUser.name;
  document.getElementById('elder-status-label').textContent=getStatusLabel(s);
  document.getElementById('elder-status-time').textContent=fmtTime(currentUser.last_checkin_at);
}
function buildElderButtons(){
  const el=document.getElementById('elder-buttons');
  const types=reminderTypes.filter(r=>r.is_checkin);
  el.innerHTML=types.map(r=>`<button class="elder-btn" onclick="doCheckin('${r.id}')">${getCheckinIcon(r.id)} ${r.label}</button>`).join('');
}
function renderElderFamily(){
  const el=document.getElementById('elder-family-row');
  const others=allMembers.filter(m=>m.user_key!==currentUser?.user_key);
  el.innerHTML=others.map(m=>{
    const s=getStatus(m);
    return`<div class="family-dot-item"><div class="family-dot ${getStatusClass(s)}" data-key="${m.user_key}"></div><div class="family-dot-name">${m.name}</div></div>`;
  }).join('');
}

// ── YOUNG VIEW ──
function initYoungView(){
  showView('view-young');
  document.getElementById('young-title').textContent='WithFamily · '+currentUser.name;
  updateYoungMyStatus();renderYoungFamily();loadHistory();
}
function updateYoungMyStatus(){
  if(!currentUser)return;
  const s=getStatus(currentUser);
  document.getElementById('young-avatar').className='my-avatar '+getStatusClass(s);
  document.getElementById('young-name').textContent=currentUser.name;
  document.getElementById('young-status-text').textContent=getStatusLabel(s)+' · '+fmtTime(currentUser.last_checkin_at);
}
function renderYoungFamily(){
  const el=document.getElementById('young-family-grid');
  const others=allMembers.filter(m=>m.user_key!==currentUser?.user_key);
  el.innerHTML=others.map(m=>{
    const s=getStatus(m);
    return`<div class="family-compact-card"><div class="compact-dot ${getStatusClass(s)}" data-key="${m.user_key}"></div><div class="compact-name">${m.name}</div><div class="compact-time">${fmtTime(m.last_checkin_at)}</div></div>`;
  }).join('');
}
async function loadHistory(){
  const{data}=await db.from('wf_events').select('*').order('created_at',{ascending:false}).limit(20);
  const el=document.getElementById('young-history');
  if(!data||!data.length){el.innerHTML='<div class="history-empty">暂无记录</div>';return}
  el.innerHTML=data.map(e=>{
    const from=allMembers.find(m=>m.user_key===e.from_key);
    const fname=from?from.name:e.from_key;
    let txt='',icon='📋';
    if(e.type==='checkin'){const rt=reminderTypes.find(r=>r.id===e.message_type);icon=getCheckinIcon(e.message_type);txt=fname+(rt?rt.voice.replace('{name}','').trim():'打卡了')}
    else if(e.type==='reminder'){const rt=reminderTypes.find(r=>r.id===e.message_type);icon='📣';const toM=e.to_key?allMembers.find(m=>m.user_key===e.to_key):null;txt=fname+'提醒'+(toM?toM.name:'大家')+(rt?'：'+rt.label:'')}
    else if(e.type==='confirm'){icon='✅';txt=fname+'确认了提醒'}
    return`<div class="history-item"><div class="history-icon">${icon}</div><div class="history-text">${txt}</div><div class="history-time">${fmtTime(e.created_at)}</div></div>`;
  }).join('');
}

// ── CHECK IN ──
async function doCheckin(typeId){
  if(!currentUser){toast('请先选择身份');return}
  const rt=reminderTypes.find(r=>r.id===typeId);if(!rt)return;
  const{error}=await db.from('wf_members').update({last_checkin_at:new Date().toISOString(),last_checkin_type:typeId}).eq('user_key',currentUser.user_key);
  if(error){toast('打卡失败');return}
  await db.from('wf_events').insert({type:'checkin',from_key:currentUser.user_key,message_type:typeId,message_text:rt.label});
  currentUser.last_checkin_at=new Date().toISOString();currentUser.last_checkin_type=typeId;
  if(currentUser.is_elder)updateElderUI();else updateYoungMyStatus();
  closeSheet('sheet-checkin');toast('✓ '+rt.label);
}
function openCheckinSheet(){
  const types=reminderTypes.filter(r=>r.is_checkin);
  document.getElementById('checkin-type-grid').innerHTML=types.map(r=>`<button class="remind-type-btn" onclick="doCheckin('${r.id}');closeSheet('sheet-checkin')">${getCheckinIcon(r.id)} ${r.label}</button>`).join('');
  openSheet('sheet-checkin');
}

// ── REMINDERS ──
function openRemindSheet(){
  const others=allMembers.filter(m=>m.user_key!==currentUser?.user_key);
  selectedRemindTo=[];selectedRemindType=null;
  document.getElementById('remind-to-grid').innerHTML=
    `<button class="member-sel-btn all-btn" onclick="toggleRemindTo('all',this)">👨‍👩‍👧‍👦 全部家人</button>`+
    others.map(m=>`<button class="member-sel-btn" onclick="toggleRemindTo('${m.user_key}',this)">${m.name}</button>`).join('');
  const types=reminderTypes.filter(r=>!r.is_checkin);
  document.getElementById('remind-type-grid').innerHTML=types.map(r=>`<button class="remind-type-btn" onclick="selectRemindType('${r.id}',this)">${r.label}</button>`).join('');
  openSheet('sheet-remind');
}
function toggleRemindTo(key,el){
  if(key==='all'){selectedRemindTo=['all'];document.querySelectorAll('#remind-to-grid .member-sel-btn').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');return}
  const allBtn=document.querySelector('#remind-to-grid .all-btn');allBtn?.classList.remove('selected');selectedRemindTo=selectedRemindTo.filter(x=>x!=='all');
  if(selectedRemindTo.includes(key)){selectedRemindTo=selectedRemindTo.filter(x=>x!==key);el.classList.remove('selected')}
  else{selectedRemindTo.push(key);el.classList.add('selected')}
}
function selectRemindType(id,el){selectedRemindType=id;document.querySelectorAll('#remind-type-grid .remind-type-btn').forEach(b=>b.classList.remove('selected'));el.classList.add('selected')}
async function sendReminder(){
  if(!currentUser){toast('请先选择身份');return}
  if(!selectedRemindTo.length){toast('请选择发送对象');return}
  if(!selectedRemindType){toast('请选择提醒内容');return}
  const targets=selectedRemindTo[0]==='all'?[null]:selectedRemindTo;
  for(const to of targets){
    await db.from('wf_events').insert({type:'reminder',from_key:currentUser.user_key,to_key:to,message_type:selectedRemindType,message_text:selectedRemindType,confirmed_by:[]});
  }
  closeSheet('sheet-remind');toast('提醒已发送 📣');
}

// ── RECEIVE & CONFIRM ──
async function loadAndCheckPendingReminders(){
  if(!currentUser)return;
  const{data}=await db.from('wf_events').select('*').eq('type','reminder').order('created_at',{ascending:false}).limit(50);
  if(!data)return;
  const myPending=data.filter(e=>(e.to_key===currentUser.user_key||e.to_key===null)&&!e.confirmed_by?.includes(currentUser.user_key));
  pendingReminders=myPending;
  if(myPending.length){updatePendingBar(myPending.length);if(myPending.length>0)showIncomingReminder(myPending[0])}
}
function updatePendingBar(count){
  const bars=['wall-pending-bar','elder-pending-bar','young-pending-bar'];
  const texts=['wall-pending-text','elder-pending-text','young-pending-text'];
  bars.forEach((id,i)=>{document.getElementById(id)?.classList.toggle('hidden',count===0);if(count>0&&document.getElementById(texts[i]))document.getElementById(texts[i]).textContent=count+'条未确认提醒'});
}
function showIncomingReminder(event){
  const from=allMembers.find(m=>m.user_key===event.from_key);
  const rt=reminderTypes.find(r=>r.id===event.message_type);
  const fname=from?from.name:event.from_key;
  document.getElementById('ro-from').textContent=fname+' 提醒你';
  document.getElementById('ro-message').textContent=rt?rt.label:event.message_text;
  document.getElementById('ro-icon').textContent=rt?getCheckinIcon(rt.id):'📣';
  currentReminderEvent=event;
  document.getElementById('reminder-overlay').classList.add('show');
  const voiceText=rt?rt.voice.replace('{name}',fname):fname+'提醒你';
  speak(voiceText);vibrate();showNotification('WithFamily',voiceText);
}
function showPendingReminder(){if(pendingReminders.length)showIncomingReminder(pendingReminders[0])}
async function confirmReminder(){
  if(!currentReminderEvent||!currentUser)return;
  document.getElementById('reminder-overlay').classList.remove('show');
  const{data}=await db.from('wf_events').select('confirmed_by').eq('id',currentReminderEvent.id).single();
  const existing=data?.confirmed_by||[];
  if(!existing.includes(currentUser.user_key)){
    await db.from('wf_events').update({confirmed_by:[...existing,currentUser.user_key]}).eq('id',currentReminderEvent.id);
    await db.from('wf_events').insert({type:'confirm',from_key:currentUser.user_key,to_key:currentReminderEvent.from_key,message_type:currentReminderEvent.message_type});
  }
  pendingReminders=pendingReminders.filter(r=>r.id!==currentReminderEvent.id);
  updatePendingBar(pendingReminders.length);currentReminderEvent=null;toast('已确认 ✓');
}

// ── REALTIME ──
function subscribeRealtime(){
  db.channel('wf-changes')
    .on('postgres_changes',{event:'*',schema:'public',table:'wf_members'},payload=>{
      const idx=allMembers.findIndex(m=>m.id===payload.new?.id);
      if(idx>=0)allMembers[idx]={...allMembers[idx],...payload.new};
      else if(payload.eventType==='INSERT')allMembers.push(payload.new);
      if(payload.eventType==='DELETE')allMembers=allMembers.filter(m=>m.id!==payload.old?.id);
      if(currentUser){const updated=allMembers.find(m=>m.user_key===currentUser.user_key);if(updated)currentUser=updated}
      refreshCurrentView();
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'wf_events'},payload=>{
      const e=payload.new;
      if(e.type==='checkin'){
        const m=allMembers.find(x=>x.user_key===e.from_key);if(m){m.last_checkin_at=e.created_at;m.last_checkin_type=e.message_type}
        if(currentUser&&e.from_key!==currentUser.user_key){
          const from=allMembers.find(x=>x.user_key===e.from_key);const rt=reminderTypes.find(r=>r.id===e.message_type);
          const msg=(from?from.name:'')+(rt?' '+rt.voice.replace('{name}','').trim():'打卡了');
          toast(msg);showNotification('WithFamily',msg);
        }
        refreshCurrentView();
      }
      if(e.type==='reminder'){
        if(!currentUser)return;
        const isForMe=e.to_key===currentUser.user_key||e.to_key===null;
        const isFromMe=e.from_key===currentUser.user_key;
        if(isForMe&&!isFromMe){pendingReminders.unshift(e);updatePendingBar(pendingReminders.length);showIncomingReminder(e)}
      }
      if(e.type==='confirm'&&currentUser&&e.to_key===currentUser.user_key){
        const from=allMembers.find(x=>x.user_key===e.from_key);
        toast((from?from.name:'对方')+'已确认 ✅');
      }
      if(currentUser?.is_elder===false)loadHistory();
    })
    .subscribe();
}
function refreshCurrentView(){
  const activeView=document.querySelector('.view.active')?.id;
  if(activeView==='view-wall')renderWall();
  else if(activeView==='view-elder'){updateElderUI();renderElderFamily()}
  else if(activeView==='view-young'){updateYoungMyStatus();renderYoungFamily()}
}

function openAdminPrompt(){showPwdOverlay()}
function showPwdOverlay(){document.getElementById('pwd-overlay').classList.add('show');setTimeout(()=>document.getElementById('pwd-input')?.focus(),100)}
function closePwdOverlay(){document.getElementById('pwd-overlay').classList.remove('show');document.getElementById('pwd-input').value=''}

}
async function showAdmin(){

}
function switchToMain(){currentUser?refreshCurrentView():null;const url=new URLSearchParams(location.search);const key=url.get('user');if(key){const m=allMembers.find(x=>x.user_key===key);if(m){currentUser=m;if(m.is_elder)initElderView();else initYoungView();return}}showView('view-wall');renderWall()}
async function renderAdminMembers(){
  const el=document.getElementById('admin-member-list');
  if(!allMembers.length){el.innerHTML='<div style="color:var(--text-dim);font-size:13px">暂无成员</div>';return}
  el.innerHTML=allMembers.map(m=>`<div class="member-admin-item"><div><div class="member-admin-name">${m.name} ${m.is_elder?'👴':'👤'}</div><div class="member-admin-key">?user=${m.user_key}</div></div><button class="item-del" onclick="deleteMember(${m.id},'${m.name}')">✕</button></div>`).join('');
}
function renderAdminLinks(){
  const el=document.getElementById('admin-links');
  const base=location.origin+location.pathname;
  el.innerHTML=allMembers.map(m=>`<div style="margin-bottom:8px"><div style="font-size:12px;color:var(--text-dim);margin-bottom:3px">${m.name}</div><div class="link-box" onclick="copyLink('${base}?user=${m.user_key}')">${base}?user=${m.user_key} 📋</div></div>`).join('');
}
async function renderAdminReminders(){
  const el=document.getElementById('admin-reminder-list');

}
async function renderAdminHistory(){
  const el=document.getElementById('admin-history');
  const{data}=await db.from('wf_events').select('*').order('created_at',{ascending:false}).limit(30);
  if(!data||!data.length){el.innerHTML='<div class="history-empty">暂无记录</div>';return}
  el.innerHTML=data.map(e=>{const from=allMembers.find(m=>m.user_key===e.from_key);return`<div class="history-item"><div class="history-text"><b>${from?from.name:e.from_key}</b> ${e.type} ${e.message_type||''} ${e.to_key?'→'+e.to_key:''}</div><div class="history-time">${fmtTime(e.created_at)}</div></div>`}).join('');
}
function openAddMemberSheet(){document.getElementById('new-member-name').value='';document.getElementById('new-member-key').value='';document.getElementById('elder-toggle').classList.remove('on');openSheet('sheet-add-member')}
async function addMember(){
  const name=document.getElementById('new-member-name').value.trim();
  const key=document.getElementById('new-member-key').value.trim().replace(/\s+/g,'');
  const isElder=document.getElementById('elder-toggle').classList.contains('on');
  if(!name||!key){toast('请填写称呼和标识');return}
  if(allMembers.find(m=>m.user_key===key)){toast('标识已存在');return}
  const{error}=await db.from('wf_members').insert({name,user_key:key,is_elder:isElder,sort_order:allMembers.length});
  if(error){toast('添加失败');return}
  await loadMembers();closeSheet('sheet-add-member');renderAdminMembers();renderAdminLinks();toast('已添加：'+name);
}
async function deleteMember(id,name){
  if(!confirm('删除成员：'+name+'？'))return;
  await db.from('wf_members').delete().eq('id',id);
  await loadMembers();renderAdminMembers();renderAdminLinks();toast('已删除');
}
function openAddReminderSheet(){document.getElementById('new-remind-label').value='';document.getElementById('new-remind-voice').value='';document.getElementById('checkin-toggle').classList.remove('on');openSheet('sheet-add-reminder')}
async function addReminderType(){
  const label=document.getElementById('new-remind-label').value.trim();
  const voice=document.getElementById('new-remind-voice').value.trim();
  const isCheckin=document.getElementById('checkin-toggle').classList.contains('on');
  if(!label||!voice){toast('请填写按钮文字和语音');return}
  const id='custom_'+Date.now();
  reminderTypes.push({id,label,voice,is_checkin:isCheckin});
  await db.from('wf_settings').update({value:reminderTypes}).eq('key','reminder_types');
  closeSheet('sheet-add-reminder');renderAdminReminders();toast('已添加');
}
async function deleteReminderType(id){
  reminderTypes=reminderTypes.filter(r=>r.id!==id);
  await db.from('wf_settings').update({value:reminderTypes}).eq('key','reminder_types');
  renderAdminReminders();toast('已删除');
}
async function cleanOldEvents(){
  if(!confirm('清理30天前的所有记录？'))return;
  const cutoff=new Date(Date.now()-30*24*3600000).toISOString();
  await db.from('wf_events').delete().lt('created_at',cutoff);
  await renderAdminHistory();toast('清理完成');
}
function copyLink(url){navigator.clipboard?.writeText(url).then(()=>toast('链接已复制 ✓')).catch(()=>toast(url))}

// ── NOTIFICATIONS ──
function requestNotificationPermission(){if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()}
function showNotification(title,body){if('Notification'in window&&Notification.permission==='granted'){const n=new Notification(title,{body,icon:'./icon-192.png',vibrate:[200,100,200]});setTimeout(()=>n.close(),5000)}}
function speak(text){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=0.9;window.speechSynthesis.speak(u)}
function vibrate(){if(navigator.vibrate)navigator.vibrate([300,100,300,100,300])}

// ── WAKE LOCK (elder) ──
async function requestWakeLock(){try{if('wakeLock'in navigator)await navigator.wakeLock.request('screen')}catch(e){}}

// ── UTILS ──
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id)?.classList.add('active');if(id==='view-elder')requestWakeLock()}
function openSheet(id){document.getElementById(id).classList.add('open')}
function closeSheet(id){document.getElementById(id).classList.remove('open')}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500)}
